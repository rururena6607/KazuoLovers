<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サーブレシーブ記録</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mute:#6b7488;--line:#dfe4ee;--pri:#2457e6;--pri-ink:#fff;--ok:#12a150;--warn:#e69a00;--ng:#d9363e;--court:#f6c36a}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--ink:#eef1f8;--mute:#9aa4bb;--line:#2b3348;--pri:#5b86ff;--court:#8a6a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:720px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font-size:14px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:14px;color:var(--mute);margin:0 0 8px;font-weight:700}
.grid{display:grid;gap:8px}
.btn{min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:16px;font-weight:600;padding:6px 8px;cursor:pointer}
.btn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.sm{min-height:36px;font-size:14px}
.btn.big{min-height:56px;background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-size:18px;width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
.court{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--court);padding:6px;border-radius:10px}
.court button{min-height:62px;border:0;border-radius:6px;background:rgba(255,255,255,.75);font-size:20px;font-weight:700;color:#1c2333;position:relative}
.court button.on{background:var(--pri);color:#fff}
.net{height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);margin:4px 0;opacity:.6}
.res{grid-template-columns:repeat(2,1fr)}
.res .ace{border-color:var(--ok)}.res .ace.on{background:var(--ok);border-color:var(--ok)}
.res .miss{border-color:var(--ng)}.res .miss.on{background:var(--ng);border-color:var(--ng)}
.sum{font-size:14px;color:var(--mute);min-height:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--mute);font-weight:600}td:first-child,th:first-child{text-align:left}
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.heat div{border-radius:6px;padding:10px 2px;text-align:center;font-size:13px;color:#1c2333;min-height:64px}
.heat b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.mute{color:var(--mute);font-size:13px}
.del{color:var(--ng);border-color:var(--ng)}
@media(min-width:600px){.court button{min-height:76px}}
</style>
</head>
<body>
<header>
  <h1 id="title">サーブレシーブ記録</h1>
  <select id="teamSel" aria-label="チーム"></select>
</header>
<main id="main"></main>
<nav>
  <button data-t="rec">入力</button>
  <button data-t="ana">分析</button>
  <button data-t="team">チーム</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const KEY='volley-app-v1';
const POS=['左','中央','右'];            // サーブを打つ位置(エンドライン上)
const RES=[['ace','エース','ace'],['eff','効果的',''],['in','通常',''],['miss','ミス','miss']];
const RCV=[['A','A 良'],['B','B'],['C','C'],['D','D ミス']];
const MISS_KIND=['ネット','アウト'];
const ZONE_NAME=['','④前左','③前中','②前右','⑤後左','⑥後中','①後右'];
// 相手コート3x2 表示順(上=ネット側): 4 3 2 / 5 6 1
const ZONE_ORDER=[4,3,2,5,6,1];

let S=load();
let tab='rec';
let draft=freshDraft();

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.teams)return d}catch(e){}return{teams:[],cur:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存できません')}}
function freshDraft(keep){return Object.assign({server:null,pos:null,zone:null,res:null,rcv:null,receiver:null},keep||{})}
function team(){return S.teams.find(t=>t.id===S.cur)||null}
function match(){const t=team();return t&&t.matches.find(m=>m.id===t.curMatch)||null}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1400)}
function pname(t,id){const p=t.players.find(p=>p.id===id);return p?(p.no?p.no+' ':'')+p.name:'?'}

function render(){
  const sel=document.getElementById('teamSel');
  sel.innerHTML=S.teams.map(t=>`<option value="${t.id}" ${t.id===S.cur?'selected':''}>${esc(t.name)}</option>`).join('')||'<option>チーム未作成</option>';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const m=document.getElementById('main');
  if(!team()&&tab!=='team'){tab='team'}
  m.innerHTML=tab==='rec'?viewRec():tab==='ana'?viewAna():viewTeam();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}

/* ---------- 入力 ---------- */
function viewRec(){
  const t=team(),mt=match();
  if(!t.players.length)return `<div class="card">先に「チーム」タブで選手を追加してください。</div>`;
  if(!mt)return `<div class="card"><h2>試合がありません</h2><p>「チーム」タブで試合を作成してください。</p><button class="btn big" onclick="go('team')">チームタブへ</button></div>`;
  const d=draft, ok=d.server&&d.pos!==null&&d.res&&(d.res==='miss'?d.missKind:d.zone)&&true;
  const needRcv=d.res&&d.res!=='miss'&&d.res!=='ace';
  const players=t.players.map(p=>`<button class="btn ${d.server===p.id?'on':''}" onclick="setD('server','${p.id}')">${p.no?esc(p.no)+'<br>':''}<span style="font-size:13px">${esc(p.name)}</span></button>`).join('');
  const court=ZONE_ORDER.map(z=>`<button class="${d.zone===z?'on':''}" onclick="setD('zone',${z})">${z}</button>`).join('');
  const rcvPlayers=t.players.map(p=>`<button class="btn sm ${d.receiver===p.id?'on':''}" onclick="setD('receiver','${p.id}')">${esc(p.name)}</button>`).join('');
  const n=mt.logs.length;
  return `
  <div class="card"><div class="row"><b>vs ${esc(mt.opp)}</b><span class="mute">${esc(mt.date)}・${n}本記録</span></div></div>
  <div class="card"><h2>① 誰が打つ(サーバー)</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(76px,1fr))">${players}</div></div>
  <div class="card"><h2>② どこから打つ</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)">${POS.map((p,i)=>`<button class="btn ${d.pos===i?'on':''}" onclick="setD('pos',${i})">${p}</button>`).join('')}</div></div>
  <div class="card"><h2>③ どこを狙った(相手コート)</h2>
    <div class="mute" style="margin-bottom:4px">↑ ネット側</div><div class="net"></div>
    <div class="court">${court}</div></div>
  <div class="card"><h2>④ 結果</h2><div class="grid res">${RES.map(r=>`<button class="btn ${r[2]} ${d.res===r[0]?'on':''}" onclick="setD('res','${r[0]}')">${r[1]}</button>`).join('')}</div>
    ${d.res==='miss'?`<div class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:8px">${MISS_KIND.map(k=>`<button class="btn sm ${d.missKind===k?'on':''}" onclick="setD('missKind','${k}')">${k}</button>`).join('')}</div>`:''}
  </div>
  ${d.res&&d.res!=='miss'?`<div class="card"><h2>⑤ レシーブ(任意)</h2>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">${RCV.map(r=>`<button class="btn ${d.rcv===r[0]?'on':''}" onclick="setD('rcv','${r[0]}')">${r[1]}</button>`).join('')}</div>
    <div class="row">${rcvPlayers}</div></div>`:''}
  <div class="sum">${summary()}</div>
  <div class="grid" style="grid-template-columns:1fr 2fr;margin-top:8px">
    <button class="btn" onclick="undo()" ${n?'':'disabled'}>↩ 取消</button>
    <button class="btn big" onclick="commit()" ${(d.server&&d.pos!==null&&d.res&&(d.res==='miss'?d.missKind:d.zone))?'':'disabled'}>記録する</button>
  </div>`;
}
function summary(){
  const t=team(),d=draft,a=[];
  if(d.server)a.push(pname(t,d.server));
  if(d.pos!==null)a.push(POS[d.pos]+'から');
  if(d.zone)a.push(d.zone+'番へ');
  if(d.res)a.push(RES.find(r=>r[0]===d.res)[1]+(d.missKind&&d.res==='miss'?'('+d.missKind+')':''));
  return a.join(' / ');
}
function setD(k,v){
  if(draft[k]===v&&k!=='res')draft[k]=null;else draft[k]=v;
  if(k==='res'){ if(v==='miss'){draft.zone=draft.zone;draft.rcv=null;draft.receiver=null}else draft.missKind=null }
  render();
}
function commit(){
  const mt=match(),d=draft;
  mt.logs.push({id:uid(),ts:Date.now(),server:d.server,pos:d.pos,zone:d.zone||null,res:d.res,missKind:d.res==='miss'?d.missKind:null,rcv:d.rcv||null,receiver:d.receiver||null});
  save();toast(mt.logs.length+'本目を記録');
  draft=freshDraft({server:d.server,pos:d.pos});   // 同じサーバーは連続入力を想定して残す
  render();window.scrollTo(0,0);
}
function undo(){const mt=match();if(!mt||!mt.logs.length)return;mt.logs.pop();save();toast('1本取り消しました');render()}
function go(t){tab=t;render()}

/* ---------- 分析 ---------- */
function allLogs(t,scope){
  const ms=scope==='all'?t.matches:t.matches.filter(m=>m.id===scope);
  return ms.flatMap(m=>m.logs);
}
let anaScope='all';
function pct(a,b){return b?Math.round(a/b*100)+'%':'-'}
function viewAna(){
  const t=team();
  if(!t.matches.length)return `<div class="card">試合データがありません。</div>`;
  if(anaScope!=='all'&&!t.matches.some(m=>m.id===anaScope))anaScope='all';
  const L=allLogs(t,anaScope);
  const opts=`<option value="all">全試合</option>`+t.matches.map(m=>`<option value="${m.id}" ${anaScope===m.id?'selected':''}>${esc(m.date)} vs ${esc(m.opp)}</option>`).join('');
  let h=`<div class="card"><div class="row"><select onchange="anaScope=this.value;render()">${opts}</select><button class="btn sm" onclick="exportCsv()">CSV出力</button></div></div>`;
  if(!L.length)return h+`<div class="card">この範囲の記録はありません。</div>`;
  // サーバー別
  const by={};
  L.forEach(l=>{const s=by[l.server]||(by[l.server]={n:0,ace:0,eff:0,miss:0});s.n++;if(l.res==='ace')s.ace++;if(l.res==='eff')s.eff++;if(l.res==='miss')s.miss++});
  h+=`<div class="card"><h2>サーブ(選手別)</h2><table><tr><th>選手</th><th>本数</th><th>エース</th><th>効果率</th><th>ミス率</th></tr>`+
   Object.entries(by).map(([id,s])=>`<tr><td>${esc(pname(t,id))}</td><td>${s.n}</td><td>${s.ace}</td><td>${pct(s.ace+s.eff,s.n)}</td><td>${pct(s.miss,s.n)}</td></tr>`).join('')+
   `</table><p class="mute">効果率=(エース+効果的)/本数</p></div>`;
  // 全体
  const tot={n:L.length,ace:0,eff:0,miss:0};L.forEach(l=>{if(l.res==='ace')tot.ace++;if(l.res==='eff')tot.eff++;if(l.res==='miss')tot.miss++});
  h+=`<div class="card"><h2>全体</h2><div class="row" style="justify-content:space-around;text-align:center">
   <div><b style="font-size:24px">${tot.n}</b><div class="mute">本数</div></div>
   <div><b style="font-size:24px">${pct(tot.ace,tot.n)}</b><div class="mute">エース率</div></div>
   <div><b style="font-size:24px">${pct(tot.ace+tot.eff,tot.n)}</b><div class="mute">効果率</div></div>
   <div><b style="font-size:24px">${pct(tot.miss,tot.n)}</b><div class="mute">ミス率</div></div></div></div>`;
  // 狙いゾーン
  const zc={};ZONE_ORDER.forEach(z=>zc[z]={n:0,win:0});
  L.forEach(l=>{if(l.zone){zc[l.zone].n++;if(l.res==='ace'||l.res==='eff')zc[l.zone].win++}});
  const mx=Math.max(1,...Object.values(zc).map(z=>z.n));
  h+=`<div class="card"><h2>狙ったゾーン(本数 / 効果率)</h2><div class="mute">↑ ネット側</div><div class="heat">`+
   ZONE_ORDER.map(z=>{const c=zc[z],a=.15+.75*c.n/mx;return `<div style="background:rgba(246,160,60,${a.toFixed(2)})">${z}<b>${c.n}</b>${pct(c.win,c.n)}</div>`}).join('')+`</div></div>`;
  // 打つ位置
  const pc=POS.map(()=>({n:0,win:0,miss:0}));
  L.forEach(l=>{const p=pc[l.pos];p.n++;if(l.res==='ace'||l.res==='eff')p.win++;if(l.res==='miss')p.miss++});
  h+=`<div class="card"><h2>打つ位置別</h2><table><tr><th>位置</th><th>本数</th><th>効果率</th><th>ミス率</th></tr>`+
   POS.map((p,i)=>`<tr><td>${p}</td><td>${pc[i].n}</td><td>${pct(pc[i].win,pc[i].n)}</td><td>${pct(pc[i].miss,pc[i].n)}</td></tr>`).join('')+`</table></div>`;
  // レシーブ(相手サーブを受けた記録ではなく、このアプリでは入力されたレシーブ評価)
  const R=L.filter(l=>l.rcv);
  if(R.length){
    const rc={};R.forEach(l=>{const k=l.receiver||'-';const r=rc[k]||(rc[k]={A:0,B:0,C:0,D:0,n:0});r[l.rcv]++;r.n++});
    h+=`<div class="card"><h2>レシーブ評価</h2><table><tr><th>選手</th><th>本数</th><th>A</th><th>B</th><th>C</th><th>D</th><th>A率</th></tr>`+
     Object.entries(rc).map(([id,r])=>`<tr><td>${id==='-'?'未指定':esc(pname(t,id))}</td><td>${r.n}</td><td>${r.A}</td><td>${r.B}</td><td>${r.C}</td><td>${r.D}</td><td>${pct(r.A,r.n)}</td></tr>`).join('')+`</table></div>`;
    const zr={};R.forEach(l=>{if(!l.zone)return;const r=zr[l.zone]||(zr[l.zone]={A:0,n:0});r.n++;if(l.rcv==='A'||l.rcv==='B')r.A++});
    h+=`<div class="card"><h2>狙ったゾーン別 A・B率(レシーブが崩れにくい所)</h2><div class="heat">`+
     ZONE_ORDER.map(z=>{const c=zr[z]||{A:0,n:0};return `<div style="background:rgba(120,170,255,${(.15+.6*(c.n?1-c.A/c.n:0)).toFixed(2)})">${z}<b>${pct(c.A,c.n)}</b>${c.n}本</div>`}).join('')+`</div><p class="mute">色が濃いほどレシーブが崩れた</p></div>`;
  }
  return h;
}
function exportCsv(){
  const t=team(),rows=[['日付','相手','選手','位置','ゾーン','結果','ミス種','レシーブ評価','レシーバー']];
  t.matches.forEach(m=>{if(anaScope!=='all'&&m.id!==anaScope)return;m.logs.forEach(l=>rows.push([m.date,m.opp,pname(t,l.server),POS[l.pos],l.zone||'',RES.find(r=>r[0]===l.res)[1],l.missKind||'',l.rcv||'',l.receiver?pname(t,l.receiver):'']))});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=t.name+'_serve.csv';a.click();
}

/* ---------- チーム ---------- */
function viewTeam(){
  const t=team();
  let h=`<div class="card"><h2>チームを作成</h2><div class="row"><input id="newTeam" placeholder="チーム名" style="flex:1"><button class="btn" onclick="addTeam()">作成</button></div></div>`;
  if(!t)return h;
  h+=`<div class="card"><h2>選手(${esc(t.name)})</h2>
    <div class="row" style="margin-bottom:8px"><input id="pNo" placeholder="背番号" inputmode="numeric" style="width:84px"><input id="pName" placeholder="名前" style="flex:1;min-width:100px"><button class="btn" onclick="addPlayer()">追加</button></div>
    ${t.players.map(p=>`<div class="row" style="padding:4px 0;border-top:1px solid var(--line)"><span style="flex:1">${p.no?esc(p.no)+' ':''}${esc(p.name)}</span><button class="btn sm del" onclick="delPlayer('${p.id}')">削除</button></div>`).join('')||'<div class="mute">選手がいません</div>'}</div>`;
  h+=`<div class="card"><h2>試合</h2>
    <div class="row" style="margin-bottom:8px"><input id="mOpp" placeholder="対戦相手" style="flex:1;min-width:120px"><input id="mDate" type="date" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}"><button class="btn" onclick="addMatch()">開始</button></div>
    ${t.matches.slice().reverse().map(m=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span style="flex:1">${esc(m.date)} vs ${esc(m.opp)} <span class="mute">${m.logs.length}本</span></span>
      <button class="btn sm ${t.curMatch===m.id?'on':''}" onclick="selMatch('${m.id}')">${t.curMatch===m.id?'記録中':'選択'}</button>
      <button class="btn sm del" onclick="delMatch('${m.id}')">削除</button></div>`).join('')||'<div class="mute">試合がありません</div>'}</div>`;
  h+=`<div class="card"><h2>データ</h2><div class="row"><button class="btn sm" onclick="exportJson()">バックアップ保存</button><label class="btn sm" style="display:inline-flex;align-items:center">読み込み<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label><button class="btn sm del" onclick="delTeam()">このチームを削除</button></div></div>`;
  return h;
}
function addTeam(){const n=document.getElementById('newTeam').value.trim();if(!n)return;const t={id:uid(),name:n,players:[],matches:[],curMatch:null};S.teams.push(t);S.cur=t.id;save();render()}
function addPlayer(){const t=team(),no=document.getElementById('pNo').value.trim(),n=document.getElementById('pName').value.trim();if(!n)return toast('名前を入力');t.players.push({id:uid(),no,name:n});save();render()}
function delPlayer(id){if(!confirm('削除しますか?(過去の記録は残ります)'))return;const t=team();t.players=t.players.filter(p=>p.id!==id);save();render()}
function addMatch(){const t=team(),o=document.getElementById('mOpp').value.trim();if(!o)return toast('対戦相手を入力');const m={id:uid(),opp:o,date:document.getElementById('mDate').value,logs:[]};t.matches.push(m);t.curMatch=m.id;draft=freshDraft();save();tab='rec';render()}
function selMatch(id){team().curMatch=id;draft=freshDraft();save();tab='rec';render()}
function delMatch(id){if(!confirm('この試合の記録をすべて削除しますか?'))return;const t=team();t.matches=t.matches.filter(m=>m.id!==id);if(t.curMatch===id)t.curMatch=null;save();render()}
function delTeam(){if(!confirm('チームと全記録を削除しますか?'))return;S.teams=S.teams.filter(t=>t.id!==S.cur);S.cur=S.teams[0]?S.teams[0].id:null;save();render()}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='volley-backup.json';a.click()}
function importJson(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.teams)throw 0;if(!confirm('現在のデータを置き換えますか?'))return;S=d;save();render()}catch(e){toast('読み込めません')}};r.readAsText(f)}

document.getElementById('teamSel').onchange=e=>{S.cur=e.target.value;draft=freshDraft();save();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
if(!S.cur&&S.teams[0])S.cur=S.teams[0].id;
render();
</script>
</body>
</html>
